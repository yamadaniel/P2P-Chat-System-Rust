<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
      <header>
        <a href="index.html"><img src="assets/error.jpg" height="60" alt="ホーム"></a>
        <p id="greet-msg"></p>
      </header>

      <main>
        <!-- <p>言語設定</p> -->

        <h2>アプリ設定</h2>
        <p>ダークモード
            <label class="toggle-switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
        </p>

        <p>PC起動時に自動起動
            <label class="toggle-switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
            </label>
        </p>

        <p>タスクトレイに常駐
            <label class="toggle-switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
        </p>

        <button id="send" value="適用する"></button>

        <h2>アカウント設定</h2>
        <p>ユーザーID</p>
        <p>パスワード変更</p> <!-- 処理については検討-->
        <p>ログアウト</p>


        <p>バージョン
        </p>
        

        
      </main>


      
  </body>
</html>
