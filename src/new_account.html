<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewAccount | LynQ</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
      <header>
        <a href="index.html"><img src="assets/error.jpg" height="60" alt="ホーム"></a>
      </header>

      <main>
        <p>新規登録</p>
        <!-- <p id="small">別端末の場合は新しいアカウントを作成することを推奨します</p> -->
        <br>
        
        <form action="" method="">

          <div id="mail">
            <p>メールアドレス</p>
            <input type="email" id="email" name="email" autocomplete="email" 
            placeholder="example@example.com" required>
          </div>

          <br>

          <div id="passwd">
            <p>パスワード</p>
            <input type="password" id="password" name="password" minlength="8" 
            autocomplete="new-password" placeholder="パスワードは8ケタ以上で設定してください" 
             required>
          </div>

          <br>

          <div id="userId">
            <p>ユーザーID</p>
            <p class="small">このIDは以後変更できません</p>
            <p class="small">使用済みのユーザーIDは使用できません</p>
            <input type="text" id="user_id" name="user_id" minlength="5" required>
          </div>

          <br>

          <input type="submit" class="lbutton" value="登録">

        </form> 
        
      </main>


      
  </body>
</html>
